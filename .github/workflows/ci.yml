name: CI/CD Pipeline - Maderas Melgar Web

on:
  push:
    branches:
      - main
      - master
      - propuesta-2
      - '**'
  pull_request:
    branches:
      - main
      - master
      - propuesta-2

jobs:
  test-and-build:
    name: QA, Vitest Testing & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Automated Vitest Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
